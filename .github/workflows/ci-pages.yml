name: Check and publish demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun audit
      - name: Generate pinned upstream reference HTML (not checked in)
        run: bun run references:prepare
      - name: Audit reference renderer dependencies
        run: bun audit
        working-directory: scripts/render-react-email-references
      - run: bun run check
      - run: bun run build
      - run: bun run test:package
      - run: bun run build:demo
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results
            !test-results/templates-01-barebone-*/**
            !test-results/templates-02-matte-*/**
            !test-results/templates-03-protocol-*/**
            !test-results/templates-04-arcane-*/**
            !test-results/templates-05-studio-*/**
            !test-results/templates-community-*/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-comparison-01-barebone
          path: test-results/templates-01-barebone-*/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-comparison-02-matte
          path: test-results/templates-02-matte-*/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-comparison-03-protocol
          path: test-results/templates-03-protocol-*/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-comparison-04-arcane
          path: test-results/templates-04-arcane-*/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-comparison-05-studio
          path: test-results/templates-05-studio-*/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-comparison-community
          path: test-results/templates-community-*/**
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: demo-dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
